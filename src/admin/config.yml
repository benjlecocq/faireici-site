# Back office fair[e]ici — configuration Decap CMS
# Seul le bloc "backend" ci-dessous est à compléter (voir LISEZ-MOI.md, étape 3).
backend:
  name: "git-gateway"
  repo: "VOTRE-COMPTE/faireici-site"
  branch: "main"
  identity_url: "https://auth.decapbridge.com/sites/A-REMPLACER"
  gateway_url: "https://gateway.decapbridge.com"
  commit_messages:
    create: "Ajout {{collection}} « {{slug}} »"
    update: "Mise à jour {{collection}} « {{slug}} »"
    delete: "Suppression {{collection}} « {{slug}} »"
    uploadMedia: "Ajout média « {{path}} »"
    deleteMedia: "Suppression média « {{path}} »"
local_backend: true
locale: "fr"
site_url: "https://faireici.pages.dev"
display_url: "https://faireici.pages.dev"
logo_url: "/assets/logo-v3.png"
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"
collections:
  - name: "realisations"
    label: "Réalisations"
    label_singular: "réalisation"
    description: "Chaque réalisation génère sa propre page (/realisations/…) et apparaît dans la galerie, les filtres et le book PDF."
    folder: "src/realisations"
    extension: "md"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{fields.slug}}"
    identifier_field: "titre"
    summary: "{{ordre}} · {{client}} - {{titre}}"
    sortable_fields: ["ordre","annee","titre","client"]
    fields:
      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        value_type: "int"
        default: 1
        hint: "1 = affichée en premier dans la galerie"
      - label: "Titre de la mission"
        name: "titre"
        widget: "string"
      - label: "Adresse de la page"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9-]+$","Minuscules, chiffres et tirets uniquement, sans accents (ex. strategie-innovation-chartres-metropole)"]
        hint: "Règle : objet-mission-nom-commanditaire, en minuscules sans accents, mots séparés par des tirets. Ex. strategie-innovation-chartres-metropole → /realisations/strategie-innovation-chartres-metropole.html. À ne plus modifier une fois publiée (référencement)."
      - label: "Client / maître d’ouvrage"
        name: "client"
        widget: "string"
      - label: "Année ou période"
        name: "annee"
        widget: "string"
        hint: "Ex. 2025 ou 2025 – 2026"
      - label: "Budget"
        name: "budget"
        widget: "string"
        required: false
        hint: "Ex. 46 775 € HT — laisser vide pour masquer"
      - label: "Contact client"
        name: "contact_client"
        widget: "string"
        required: false
      - label: "Localité"
        name: "localite"
        widget: "string"
        hint: "Ex. Barr (67)"
      - label: "Partenaires"
        name: "partenaires"
        widget: "string"
        required: false
        hint: "Affiché « En partenariat avec … » — laisser vide pour masquer"
      - label: "Expertises (filtres)"
        name: "expertises"
        widget: "select"
        multiple: true
        min: 1
        options:
          - label: "Résilience économique"
            value: "diversification"
          - label: "Offre d'accueil territoriale"
            value: "offre-accueil"
          - label: "Attractivité territoriale"
            value: "attractivite"
          - label: "Programmation"
            value: "programmation"
          - label: "Entrepreneuriat & ESS"
            value: "ess"
      - label: "Image principale"
        name: "image"
        widget: "image"
        hint: "Format paysage, 1600 px de large conseillé"
      - label: "Contexte & objectifs"
        name: "contexte"
        widget: "markdown"
        modes: ["rich_text"]
        buttons: ["bold","bulleted-list"]
        editor_components: []
        hint: "Vous pouvez coller un texte déjà mis en forme (Word, e-mail…). Boutons B = gras, liste = puces."
      - label: "Méthodologie"
        name: "methodo"
        widget: "markdown"
        modes: ["rich_text"]
        buttons: ["bold","bulleted-list"]
        editor_components: []
        hint: "Collez votre texte tel quel : les puces Word (▪ •) deviennent de vraies puces et « Etape 1 : … » passe en gras sur sa ligne, automatiquement à la publication."
      - label: "Fiche PDF (facultatif)"
        name: "pdf"
        widget: "file"
        required: false
        hint: "Si renseignée, un bouton « Télécharger la fiche PDF » apparaît sur la page. Le book PDF de la galerie reste généré automatiquement."
      - label: "Description Google (facultatif)"
        name: "description_seo"
        widget: "text"
        required: false
        hint: "Si vide, le début du contexte est utilisé"
